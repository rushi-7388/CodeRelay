upstream coderelay_api {
    least_conn;
    server host.docker.internal:5000 max_fails=2 fail_timeout=10s;
    # Add more upstreams when running multiple API instances:
    # server host.docker.internal:5001 max_fails=2 fail_timeout=10s;
}

server {
    listen 8080;

    location /health/live {
        proxy_pass http://coderelay_api/health/live;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://coderelay_api;
    }
}
